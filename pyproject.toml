[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "medtech"
version = "0.2"
requires-python = ">=3.9"
dependencies = ["rich"]

[project.scripts]
medtech = "medtech.cli:main"

[tool.setuptools]
packages = ["medtech"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: requires a reachable Docker daemon and sandbox image"]
