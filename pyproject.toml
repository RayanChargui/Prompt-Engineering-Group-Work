[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "medtech"
version = "0.2"
requires-python = ">=3.9"
dependencies = ["rich", "textual>=0.89,<2"]

[project.scripts]
medtech = "medtech.cli:main"

[tool.setuptools]
packages = ["medtech"]

[tool.setuptools.package-data]
medtech = ["*.tcss", "themes.json"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.23,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["docker: requires a reachable Docker daemon and sandbox image"]
